{% extends "layouts/base.html" %}

{% block title %}{{ term.name }} - {{ taxonomy.name | capitalize }} - {{ config.title }}{% endblock %}

{% block content %}
<h2>{{ term.name }}</h2>


{% if term.pages %}
    {% for page in term.pages %}
        {{ <article_card page={page} /> }}
    {% endfor %}
{% else %}
    {{ <empty_state /> }}
{% endif %}

{% endblock content %}
